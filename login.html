<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_OS // Access Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body { font-family: 'Fira Code', monospace; }
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.25; }
    </style>
</head>
<body class="bg-black text-emerald-400 min-h-screen flex items-center justify-center px-4 py-10 relative overflow-hidden">
    <canvas id="matrixCanvas"></canvas>

    <div class="w-full max-w-md bg-zinc-950/90 border-2 border-emerald-500/40 shadow-[0_0_25px_rgba(16,185,129,0.2)] p-6 md:p-8 relative z-10 backdrop-blur-sm">
        <div class="mb-6 border-b border-emerald-500/30 pb-4">
            <div class="text-xs text-emerald-600 tracking-widest uppercase">[AUTH_LAYER]</div>
            <h1 class="mt-2 text-2xl font-bold tracking-wider text-emerald-300">>&nbsp;LOGIN ACCESS <i class="fa-solid fa-user-lock"></i></h1>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label for="username" class="block text-xs uppercase tracking-widest text-emerald-500 mb-2">Username</label>
                <input id="username" type="text" required
                    class="w-full bg-black border border-emerald-500/50 rounded-none px-4 py-3 text-sm text-emerald-300 placeholder-emerald-800 focus:outline-none focus:border-emerald-400">
            </div>

            <div>
                <label for="password" class="block text-xs uppercase tracking-widest text-emerald-500 mb-2">Password</label>
                <input id="password" type="password" required
                    class="w-full bg-black border border-emerald-500/50 rounded-none px-4 py-3 text-sm text-emerald-300 placeholder-emerald-800 focus:outline-none focus:border-emerald-400">
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 rounded-none text-sm tracking-wider uppercase transition cursor-pointer">
                [ ENTER SYSTEM ]
            </button>
        </form>

        <div class="mt-5 text-xs text-emerald-700 border-t border-emerald-500/20 pt-4">
            Butuh Akses? Hubungi <span class="text-emerald-400 font-bold">mazawgg.07@gmail.com</span> untuk mendapatkan kredensial.
        </div>

        <div id="loginError" class="mt-4 hidden text-xs text-red-400 border border-red-500/30 bg-red-500/10 p-3">
            // ACCESS DENIED. INVALID CREDENTIALS.
        </div>
    </div>

    <script>
    const AUTH_KEY = 'cyber_user_session';
    const USERS_DB_KEY = 'cyber_users';
    const CURRENT_USER_KEY = 'cyber_current_user';

    if (!localStorage.getItem(USERS_DB_KEY)) {
        const defaultUsers = [
            { username: 'mazaw', password: 'cyber123', role: 'mazaw' },
            { username: 'admin', password: 'adminpassword', role: 'admin' }
        ];
        localStorage.setItem(USERS_DB_KEY, JSON.stringify(defaultUsers));
    }

    if (localStorage.getItem(AUTH_KEY) === 'active') {
        window.location.href = 'index.html';
    }

    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorBox = document.getElementById('loginError');

    form.addEventListener('submit', (event) => {
        event.preventDefault();
        const inputUser = usernameInput.value.trim();
        const inputPass = passwordInput.value.trim();

        const registeredUsers = JSON.parse(localStorage.getItem(USERS_DB_KEY)) || [];
        const validUser = registeredUsers.find(u => u.username === inputUser && u.password === inputPass);

        if (validUser) {
            localStorage.setItem(AUTH_KEY, 'active');
            localStorage.setItem(CURRENT_USER_KEY, validUser.username);
            localStorage.setItem('cyber_user_role', validUser.role || 'user');
            window.location.href = 'index.html';
            return;
        }

        errorBox.classList.remove('hidden');
        errorBox.textContent = '// ACCESS DENIED. INVALID CREDENTIALS.';
        form.reset();
        usernameInput.focus();
    });

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const binaryChars = '01';
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#10b981';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            const text = binaryChars.charAt(Math.floor(Math.random() * binaryChars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 50);
</script>
</body>
</html>
